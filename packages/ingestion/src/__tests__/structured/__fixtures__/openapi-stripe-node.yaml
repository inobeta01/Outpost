openapi: 3.0.0
info:
  title: Stripe API
  version: 18.2.0
  description: The Stripe API allows you to create, retrieve, update, and delete objects.
  contact:
    name: Stripe Support
    email: support@stripe.com
servers:
  - url: https://api.stripe.com/v1
paths:
  /charges:
    get:
      summary: List all charges
      operationId: listCharges
      responses:
        '200':
          description: Successful response
  /customers:
    get:
      summary: List all customers
      operationId: listCustomers
      responses:
        '200':
          description: Successful response
components:
  schemas:
    Charge:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
